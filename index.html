<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo Minado 3D</title>
    <link rel="icon" type="image/x-icon" href="./src/assets/icons/icon.ico">
    <link rel="stylesheet" href="./src/styles/style.css">
</head>

<body>
    <h1>Campo Minado 3D</h1>
    <div class="menu-lateral">
        <div id="painel-instrucoes">
            <h3>🎮 COMANDOS DO JOGO</h3>
            <p id="instrucao-revelar">🖱️ <strong>Clique Esquerdo:</strong> Revelar quadrado (Cuidado com as bombas!)
            </p>
            <p id="instrucao-bandeira">🚩 <strong>Clique Direito:</strong> Marcar / Desmarcar bandeira</p>
            <p>🔄 <strong>Botão Reiniciar:</strong> Limpa o tabuleiro e recomeça o tempo</p>
        </div>

        <div id="controle-mobile-modo">
            <button id="btn-modo-toque" class="modo-cavar">
                <span class="icone-modo">⛏️</span> Modo: Revelar
            </button>
        </div>

        <div id="hud">
            <div class="display">💣 Minas: <span id="contador-minas">20</span></div>
            <select id="selecionar-dificuldade">
                <option value="facil">Fácil</option>
                <option value="medio">Médio</option>
                <option value="dificil">Difícil</option>
            </select>
            <button id="btn-reiniciar">🔄 Reiniciar</button>
            <div class="display">⏱️ Tempo: <span id="cronometro">000</span></div>
        </div>
    </div>

    <div id="cena-3d">
        <layout-campo></layout-campo>
    </div>
    <div id="modal-fim-jogo" class="modal">
        <div class="modal-conteudo">
            <div id="modal-icone">🏆</div>
            <h2 id="modal-titulo">VITÓRIA!</h2>
            <p id="modal-mensagem">Você limpou o campo em <span id="modal-tempo">000</span> segundos.</p>
            <button id="btn-modal-jogar" onclick="document.getElementById('btn-reiniciar').click()">Jogar
                Novamente</button>
        </div>
    </div>


    <script type="module" src="./src/main.js"></script>
</body>

</html>
